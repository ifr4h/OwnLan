services:
  postgres:
    image: postgres:16-alpine
    container_name: ownlane-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ownlane
      POSTGRES_USER: ownlane
      POSTGRES_PASSWORD: ownlane
    volumes:
      - ownlane_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownlane -d ownlane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ownlane_postgres_data:
